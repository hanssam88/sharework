name: Release — iOS + Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      android_track:
        description: "Play Console track"
        required: true
        default: "internal"
        type: choice
        options: [internal, beta, production]
      ios_lane:
        description: "iOS Fastlane lane"
        required: true
        default: "beta"
        type: choice
        options: [beta, release]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.27.0
  FLUTTER_CHANNEL: stable
  APP_ORG: kr.sharework
  APP_NAME: sharework_mockup

jobs:
  android:
    name: Android — Play Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: deploy

      - name: Scaffold Android platform files
        run: flutter create . --platforms=android --project-name=${{ env.APP_NAME }} --org=${{ env.APP_ORG }}

      - name: Sync Fastlane config into android/
        run: |
          mkdir -p android/fastlane
          cp deploy/android/Fastfile android/fastlane/Fastfile
          cp deploy/android/Appfile android/fastlane/Appfile
          cp deploy/Gemfile android/Gemfile

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Configure key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Patch app/build.gradle for release signing
        run: |
          GRADLE_FILE=$(ls android/app/build.gradle* 2>/dev/null | head -1)
          if ! grep -q "key.properties" "$GRADLE_FILE"; then
            python3 deploy/scripts/patch_android_gradle.py "$GRADLE_FILE"
          fi

      - name: Set version from tag (if push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=${{ github.run_number }}
          sed -i "s/^version: .*/version: ${TAG_VERSION}+${BUILD_NUMBER}/" pubspec.yaml

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Decode Play Console service account
        env:
          PLAY_KEY_JSON: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: echo "$PLAY_KEY_JSON" > /tmp/play-store-key.json

      - name: Upload via Fastlane
        working-directory: android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: /tmp/play-store-key.json
          AAB_PATH: ../build/app/outputs/bundle/release/app-release.aab
          LANE: ${{ github.event.inputs.android_track == 'production' && 'deploy_production' || (github.event.inputs.android_track == 'beta' && 'deploy_beta' || 'deploy_internal') }}
        run: bundle exec fastlane android $LANE

  ios:
    name: iOS — TestFlight / App Store
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: deploy

      - name: Scaffold iOS platform files
        run: flutter create . --platforms=ios --project-name=${{ env.APP_NAME }} --org=${{ env.APP_ORG }}

      - name: Sync Fastlane config into ios/
        run: |
          mkdir -p ios/fastlane
          cp deploy/ios/Fastfile ios/fastlane/Fastfile
          cp deploy/ios/Appfile ios/fastlane/Appfile
          cp deploy/Gemfile ios/Gemfile

      - name: Set version from tag (if push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=${{ github.run_number }}
          sed -i '' "s/^version: .*/version: ${TAG_VERSION}+${BUILD_NUMBER}/" pubspec.yaml

      - name: flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        working-directory: ios
        run: pod install --repo-update

      - name: Build IPA (no codesign — Fastlane will sign)
        run: |
          flutter build ipa --release \
            --export-options-plist=deploy/ios/ExportOptions.plist || \
          flutter build ipa --release --no-codesign

      - name: Upload via Fastlane
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ITC_TEAM_ID: ${{ secrets.APPLE_ITC_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IPA_PATH: ../build/ios/ipa/sharework_mockup.ipa
          LANE: ${{ github.event.inputs.ios_lane || 'beta' }}
        run: bundle exec fastlane ios $LANE
