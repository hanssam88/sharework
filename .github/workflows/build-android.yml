name: Build Android Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.0
          cache: true

      - name: Scaffold android platform files
        run: flutter create . --platforms=android --project-name=sharework_mockup --org=kr.sharework

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK with run number and short SHA
        run: |
          mkdir -p out
          SHORT_SHA="${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "out/sharework-debug-${{ github.run_number }}-${SHORT_SHA}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sharework-debug-apk
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error
