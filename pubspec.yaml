name: sharework_mockup
description: Sharework mockup app (Flutter rewrite, UI-only)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # M1 wire-up
  supabase_flutter: ^2.12.4
  dio: ^5.9.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1

  # M2 photo upload
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
